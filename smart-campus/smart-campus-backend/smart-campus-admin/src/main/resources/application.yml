# ===================================================================
# 1. 项目基础核心配置
# ===================================================================
spring:
  profiles:
    active: dev
  application:
    name: smart-campus-admin
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
  datasource:
    url: jdbc:mysql://localhost:3306/smart-campus?allowMultiQueries=true&useSSL=false&serverTimezone=GMT%2B8&characterEncoding=utf8
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  task:
    scheduling:
      pool:
        size: 5
  data:
    redis:
      host: 127.0.0.1
      port: 6379
  #elasticsearch相关
  elasticsearch:
    uris: http://localhost:9200
    #username: elastic  # 如果启用了安全认证
    #password: your_password

mybatis:
  mapper-locations: classpath:/mappers/*.xml
  configuration:
    map-underscore-to-camel-case: true
# ===================================================================
# 2. WEB 服务器通用配置
# ===================================================================
server:
  port: 6061
  shutdown: graceful
  servlet:
    context-path: /api
    encoding:
      charset: UTF-8

  
#项目目录
project:
  folder: D:/VibeProjects/smart-campus

resource:
  temp-dir: resource/temp
  file-dir: resource/files
  upload-session-ttl-minutes: 120
  ffmpeg-path: ffmpeg

#日志级别
logging:
  level:
    root: INFO
