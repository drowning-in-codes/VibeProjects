# ═══════════════════════════════════════════════════════════════
# EasyTwit — xcurl-based auto-tweet configuration
# ═══════════════════════════════════════════════════════════════

# ── X/Twitter API (XDK) ───────────────────────────────────
# OAuth 1.0a 凭证在 .env 中配置
x:
  timeout: 30

# ── Anthropic (Claude) ────────────────────────────────────
# Base URL & API key from .env. Backup is used if primary fails.
anthropic:
  model: deepseek-v4-pro
  max_tokens: 2000
  # 预备 prompt 模板 (prompts/*.md 或留空跳过)
  prompt_template: prompts/viral.md

# ── Image Generation ─────────────────────────────────────
# Primary: nanobanana (Gemini API)
# Backup:  GPT-Image-2 (Chat Completions)
nanobanana:
  model: nano-banana
  size: 1024x1024

openai:
  model: gpt-image-2
  size: 1024x1024
  quality: standard

# ── Targets: users to crawl & mimic ───────────────────────
# scrape_source: "users" | "following" | "timeline" (默认 users)
targets:
  scrape_source: users
  users:
    - username: elonmusk
      enabled: false
    - username: sama
      enabled: false
    - username: karpathy
      enabled: false
  custom_persona:
    enabled: true
    description: "一个关注AI和科技前沿的理性思考者"
    keywords:
      - AI
      - 科技
      - 编程
      - 创业
      - 未来
    tone: "专业、理性、偶尔幽默"
    topics:
      - 人工智能
      - 开源技术
      - 科技趋势
      - 产品思考

# ── Scheduler ────────────────────────────────────────────
scheduler:
  run_immediately: true
  post_cron: "0 */4 * * *"
  max_posts_per_day: 6
  # 爬取配置
  scrape_limit: 20    # 每次爬取每个用户最大推文数
  following_limit: 20 # 关注列表爬取最大用户数

# ── Database ──────────────────────────────────────────────
database:
  path: ./data/easytwit.db

# ── Image Output ─────────────────────────────────────────
image:
  enabled: true
  output_dir: ./data/images

# ── Logging ──────────────────────────────────────────────
logging:
  level: INFO
  file: ./logs/easytwit.log
  rotation: 100 MB
  retention: 30 days
