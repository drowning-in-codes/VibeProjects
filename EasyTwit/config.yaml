# ═══════════════════════════════════════════════════════════════
# EasyTwit — xcurl-based auto-tweet configuration
# ═══════════════════════════════════════════════════════════════

# ── X/Twitter API (XDK) ───────────────────────────────────
# OAuth 1.0a 凭证在 .env 中配置
x:
  timeout: 30

# ── Anthropic (Claude) ────────────────────────────────────
# Base URL & API key from .env. Backup is used if primary fails.
anthropic:
  model: deepseek-v4-pro
  max_tokens: 2000
  generation_retries: 3
  # 系统 prompt (定义 AI 角色, 去 AI 味)
  system_prompt: "你是一个经验丰富的推特/公众号写手。你的文字必须读起来像真人写的——自然、有观点、带脾气、会停顿。禁止使用'在当今时代''随着技术的发展'等 AI 套话。不要总结、不要说教、不要'综上所述'。像发朋友圈一样写。字数也不一定要很长，短小精悍也可以，根据具体场景。"
  # 预备 prompt 模板 (prompts/*.md 或留空跳过)
  prompt_template: prompts/viral.md

# ── Image Generation ─────────────────────────────────────
# Primary: nanobanana (Gemini API)
# Backup:  GPT-Image-2 (Chat Completions)
nanobanana:
  model: nano-banana
  size: 1024x1024

openai:
  model: gpt-image-2
  size: 1024x1024
  quality: standard

# ── Targets: users to crawl & mimic ───────────────────────
# scrape_source: "users" | "following" | "timeline" (默认 users)
targets:
  scrape_source: users
  users:
    - username: elonmusk
      enabled: false
    - username: sama
      enabled: false
    - username: karpathy
      enabled: false
  # 人格组 (random=随机组 | tech/social/career/finance=指定组)
  persona_group: random
  # 随机选组权重 (数字越大越优先, tech>career>social>finance)
  group_weights:
    tech: 40
    career: 30
    social: 35
    finance: 30
  # 生成时带入的参考推文数 (0=不带参考推文)
  reference_tweet_count: 2

# ── Scheduler ────────────────────────────────────────────
scheduler:
  run_immediately: false
  post_cron: "0 */4 * * *"      # 发帖频率
  distill_cron: "0 0 */14 * *"  # 爬取蒸馏频率 (每两周)
  jitter_minutes: 30            # 时间扰动 (分钟, 前后随机偏移, 0=不扰动)
  max_posts_per_day: [1, 3]  # 每天在此范围内随机取值
  # 爬取配置
  scrape_limit: 5     # 每次爬取每个用户最大推文数
  following_limit: 5  # 关注列表爬取最大用户数
  # API 额度控制
  api_budget_per_day: 20       # 每日最大 API 调用次数
  metrics_fetch_limit: 10      # 每次拉取数据最多检查几条推文
  engage_limit: 5              # 每日互动上限 (like+repost 次数)

# ── Database ──────────────────────────────────────────────
database:
  path: ./data/easytwit.db

# ── Image Output ─────────────────────────────────────────
image:
  enabled: false
  output_dir: ./data/images

# ── Logging ──────────────────────────────────────────────
logging:
  level: INFO
  file: ./logs/easytwit.log
  rotation: 100 MB
  retention: 30 days
